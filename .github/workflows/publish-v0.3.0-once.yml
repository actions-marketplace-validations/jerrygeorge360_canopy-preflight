name: Publish v0.3.0 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.3.0-once.yml

permissions:
  contents: write

jobs:
  release:
    name: Build and publish v0.3.0
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.3.0
      RELEASE_SHA: f027ed55c6388aff4f360a51c655c0b639293b0f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f027ed55c6388aff4f360a51c655c0b639293b0f
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify release source
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          make check
      - name: Build release artifacts
        run: |
          set -euo pipefail
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            goos="${target%/*}"
            goarch="${target#*/}"
            make dist VERSION="$RELEASE_TAG" GOOS="$goos" GOARCH="$goarch"
          done
          cp LICENSE NOTICE dist/
          (cd dist && sha256sum canopy-doctor_* > checksums.txt)
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$RELEASE_SHA"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            asset_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            for expected in \
              canopy-doctor_v0.3.0_linux_amd64 \
              canopy-doctor_v0.3.0_linux_arm64 \
              canopy-doctor_v0.3.0_darwin_amd64 \
              canopy-doctor_v0.3.0_darwin_arm64 \
              canopy-doctor_v0.3.0_windows_amd64.exe \
              canopy-doctor_v0.3.0_windows_arm64.exe \
              checksums.txt LICENSE NOTICE
            do
              grep -Fx -- "$expected" <<<"$asset_names" >/dev/null
            done
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Canopy Doctor v0.3.0" \
            --notes "Public release of Canopy Doctor with four compatibility checks, six platform binaries, SHA-256 checksums, and automatic Canopy upstream monitoring." \
            dist/canopy-doctor_* dist/checksums.txt dist/LICENSE dist/NOTICE
