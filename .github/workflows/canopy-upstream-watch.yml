name: Canopy upstream watch

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canopy-upstream-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare reviewed Canopy evidence with upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/upstream-watch -output upstream-report.json
      - name: Write workflow summary
        run: jq -r '.markdown' upstream-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Detect required review
        id: changed
        run: echo "required=$(jq -r '.action_required' upstream-report.json)" >> "$GITHUB_OUTPUT"
      - name: Open or update compatibility review issue
        if: ${{ fromJSON(steps.changed.outputs.required || 'false') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Canopy upstream compatibility review required"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          jq -r '.markdown' upstream-report.json > "$body_file"
          issue_number="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Canopy upstream compatibility review required") | .number' | head -n 1)"
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi
